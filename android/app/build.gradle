plugins {
    id 'com.android.application'
}

android {
    namespace "com.directchat.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.directchat.app"
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
